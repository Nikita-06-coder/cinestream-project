<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist - CineStream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f1014] text-white font-sans antialiased min-h-screen">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-[#0f1014]/90 backdrop-blur-md border-b border-gray-800">
        <h1 class="text-2xl font-black tracking-wider text-cyan-400 cursor-pointer" onclick="window.location.href='index.html'">CINE<span class="text-white">STREAM</span></h1>
        <a href="index.html" class="bg-cyan-500 text-black font-semibold px-4 py-1.5 rounded-md text-sm hover:bg-cyan-400 transition">Back to Home</a>
    </nav>

    <!-- Watchlist Container -->
    <main class="px-6 md:px-16 pt-28 pb-20">
        <h2 class="text-2xl md:text-3xl font-bold mb-6 flex items-center space-x-2">
            <span class="w-2 h-6 bg-cyan-400 rounded-full"></span>
            <span>My Watchlist</span>
        </h2>

        <!-- Saved Movies Grid -->
        <div id="watchlist-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- JavaScript yahan saved movies dynamically dalega -->
        </div>
        
        <p id="empty-msg" class="text-gray-400 text-center mt-12 hidden">Aapki watchlist khali hai! Kuch movies add karein.</p>
    </main>

    <script>
        const watchlistGrid = document.getElementById('watchlist-grid');
        const emptyMsg = document.getElementById('empty-msg');
        const TMDB_IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

        function loadWatchlist() {
            const watchlist = JSON.parse(localStorage.getItem('myWatchlist')) || [];

            if (watchlist.length === 0) {
                emptyMsg.classList.remove('hidden');
                return;
            }

            watchlistGrid.innerHTML = "";
            watchlist.forEach(movie => {
                const card = `
                    <div class="movie-card cursor-pointer group relative">
                        <div class="overflow-hidden rounded-lg shadow-md aspect-[2/3] bg-gray-800">
                            <img src="${TMDB_IMAGE_URL + movie.poster_path}" alt="${movie.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <p class="text-sm font-medium truncate text-gray-200">${movie.title}</p>
                            <button onclick="removeFromWatchlist(${movie.id})" class="text-red-500 hover:text-red-400 text-xs px-2 py-1 bg-gray-800 rounded">Remove</button>
                        </div>
                    </div>
                `;
                watchlistGrid.innerHTML += card;
            });
        }

        function removeFromWatchlist(id) {
            let watchlist = JSON.parse(localStorage.getItem('myWatchlist')) || [];
            watchlist = watchlist.filter(movie => movie.id !== id);
            localStorage.setItem('myWatchlist', JSON.stringify(watchlist));
            loadWatchlist(); // Page refresh kiye bina list update karne ke liye
        }

        window.onload = loadWatchlist;
    </script>
</body>
</html>
